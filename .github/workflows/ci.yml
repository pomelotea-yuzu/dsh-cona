name: CI

# 校验逻辑的唯一事实源是仓库脚本，本流水线只做"装 Node + 调用脚本"，不另写一套判据。
# 与 pre-commit 和 .workflow/ci.yml 共用 scripts/check-repo.mjs 的门禁链。
#
# pnpm workspace 骨架落地后，在 Run gates 之前插入依赖安装步骤，并把 commands 换成：
#   pnpm install --frozen-lockfile
#   pnpm check:ci            # 内含 build / typecheck / test / lint / spec
# （见 docs/development/workflow.md「质量门禁」）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Repository gates (hygiene / links / bilingual / selftests)
        run: node scripts/check-repo.mjs --all
