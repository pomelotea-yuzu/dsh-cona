name: Feature request / 功能建议
description: Propose a capability within the plugin scope / 在插件范围内提出能力建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        当前方向：以项目代码开发为主要场景的 DSH 项目管理插件，支持动态项目树、流程与骨架模板、多对多聊天关联和 Agent 自主规划；视频制作等偶发需求可按需加入，不自研沙箱。
        当前需求与沿用边界见 docs/knowledge/decisions.md；具体使用流程与实现方案仍可讨论。
        Current direction: a DSH project management plugin primarily for software development, with a dynamic project tree, process and scaffold templates, many-to-many chat links and agent planning. Occasional needs such as video production can be added as needed; no in-house sandbox. Usage flows and implementation remain under discussion.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour / 建议行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives / 已有解法
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmations / 确认项
      options:
        - label: Read the settled decisions / 已读已定决定
          required: true
