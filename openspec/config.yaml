schema: spec-driven

context: |
  项目：dsh-cona — 以 DeepSeek Harness（DSH）为 Agent 底座、以项目代码开发为主要场景的项目管理插件。
  当前方向与用户明确需求见 docs/product/2026-11-11-project-management-design.md，
  沿用边界与被替代内容见 docs/knowledge/decisions.md。本段只是当前状态说明，不新增决定。
  Cona 的 product-decisions.md §6 保留为历史原文，“只提供检查点／交付／回退”的范围已被替代。

  当前阶段（2026-11-12）：已有项目管理设计草案、第一版架构基线、开发路线图草案与 DSH 接入静态调研；
  已建立 R1 change establish-r1-project-plugin，第 1 轮外审已完成并按意见修订；未编写插件代码、未安装依赖、未建立 workspace，接入能力未运行验证。

  用户明确的需求：
  - 动态项目树主要组织项目代码开发与相关文档；视频制作为偶发需求，可按需加入。
  - 项目与阶段均可继续拆分，默认使用过程、模板与验证案例围绕代码开发。
  - 预设与用户自建流程；骨架可在创建或后续阶段应用，也可从已有项目提炼模板。
  - Agent 根据新信息自主调整阶段；阶段与聊天多对多关联。
  - 用户也可直接编辑阶段并像搭积木一样搭建、拼接项目树；与 Agent 共用规划变更规则。
  - 用户已认可项目树、目标路线图和时间路线图共用一份规划；时间可逐步补充，依赖、展示与日期分别表达，具体界面和排期能力待细化。
  - 插件支持 i18n；用户选择首版完整支持简体中文和英文，其他宿主语言回退英文。
  - 多人可以使用不同开发环境及不同 Agent；项目资料可选项目目录（可用 Git 管理）、DSH 数据目录或自定义目录，保留用户选择权。
  - 项目资料须让其他 Agent 直接读取，新机器 DSH 取得资料后可接续；不把宿主私有数据库或旧机器 Session 作为必要前提。
  - 从零开发包含调研与竞品对照；已有项目和开发途中可在专门聊天中进行项目分析。
  - 项目功能与界面集成在 DSH 内，Host 服务是宿主插件逻辑，不另建外部应用或部署后端。
  - 用户要求 Agent 先形成架构基线和默认颗粒度，通过实践优化探索／实施边界等具体规则。
  - 为未来官方 Super-agent 保留接入边界，本轮不自研 Super-agent 或多 Agent 调度系统。
  - 文件回溯不作为架构驱动力，旧 F01–F08 不作为项目管理首版前置要求。

  已定边界：
  - 不做独立桌面 Agent 产品，不自研沙箱；复用 DSH 执行与隔离。
  - Host 插件自身读写不能假定自动继承会话沙箱或审批。
  - 纯 Node ESM，跨平台；不调用平台原生 API，不硬编码盘符与路径分隔符。
  - 三种资料位置已由用户明确要求；具体目录名与格式见数据专题设计。旧 Config.dataRoot 仅针对历史文件版本存储与账本，不预定新项目布局。
  - E 系列与 P 系列验证结论不继承；F01–F08 规范与设计仅作参考，
    代码移植后须重测路径语义（symlink、APFS 大小写、hardlink、权限位）。
  - 旧 Windows 原型与运行证据不入库，不作为本插件已验证能力。
  - 版本基线：本插件开发出第一个版本之前，不再更新本机 DSH 软件；调研、设计与实现统一固定至 DSH 0.2.2-rc.2（提交 ddac96760b6edf8fa0fe17cbdcf0b512f4c12b2c），不跟随上游后续预发布版本。

  环境与未定项：
  - 开发环境 macOS（arm64 / zsh）；现有仓库 CI 使用 Node 20，不能据此推定插件兼容版本。
  - 2026-11-12 已同步：本机 DSH 应用与 `Developer/tools/deepseek-harness/` 源码快照均为 0.2.2-rc.2（预发布）；其 CLI 要求 Node >=24.9.0，与 rc.1 一致。接入能力未运行验证，插件兼容范围仍待验证。
  - R1 提案编写与修订使用本机独立安装的 OpenSpec 1.17.0 做严格校验，命令与输出摘要见 change 的 review-response.md；外部 review 临时使用 2.0.0 的结果单列，不互相替代。
  - 许可证 MIT（见根目录 LICENSE）。
  - 使用过程、界面、数据模型与变更协议的设计基线见 docs/architecture/2026-11-11-project-development-architecture.md，仍待实践验证；R1 change 正在提案阶段，尚未实施。
  - 2026-11-12 修订保留领域／应用／接入／界面分层；跨环境以 planVersion 内容指纹核对规划，本机 planRevision／stateRevision 只在资料实例内同步，不比较不同 Git 分支的计数器。
  - 公开 JSON／Markdown 项目资料与本机会话、授权、意图／回执分离；文件适配器支持三种位置，storageDomain 仅为本机运行数据候选。详见 docs/architecture/2026-11-12-project-data-portability.md，尚未实现。
  - 公开资料和私有回执不能假定同一原子头；先保存本机意图，再发布资料，再完成回执。响应丢失先查原回执，发布结果未知则核对不盲重放；Git 回退也不重放历史命令。
  - Agent 写入须来自可信 DSH 上下文及活动 WorkRun，不信模型自报或 Git 导入的授权。绑定、快照和回执区分本机资料实例／源代际；重连及外部资料变更后回读，旧响应不覆盖新源。
  - Git 交换按独立工作副本进行；文本合并后还须领域校验，同目录外部编辑与插件保存按同步边界顺序操作，不承诺任意外部并发写入或共享网络目录多写者安全。
  - 跨分支里程碑保留单个 WorkNode 身份和自身完成条件，通过交付关联引用原节点／成果；交付关联不自动生成执行依赖或递归推导完成。
  - 本项目 R1–R6 开发安排见 docs/engineering/2026-11-12-plugin-development-roadmap.md，含交付、依赖和完成标准，尚未实施或定稿。
  - 路线图整体设计已获认可，细节见 docs/product/2026-11-12-project-roadmap-design.md；不预定完整甘特图或自动排期规则。
  - i18n 建议从第一个面板复用 DSH locale；UI 文案与用户项目原文分开，时间格式不改动日期语义。接入、资源及验收见 docs/architecture/2026-11-12-plugin-i18n-design.md，尚未实现或运行验证。
  - SDD 提醒须提供开关，关闭后不主动催促或自动重开；启用时按变更影响提醒，简单任务跳过。
  - 提醒开关默认值、设置范围及 OpenSpec 工件与项目节点的映射方式待设计；开关不修改仓库已有门禁。
  - push 与 tag 归用户；远程同步状态只认实时命令。
  - Change 工作流见 docs/development/workflow.md：写完并校验后保持未提交，交用户安排其他 Agent 审阅；review.md 落入 change 后，编写 Agent 阅读并按情况修订，在 review-response.md 逐项记录处理依据，重新校验后再提交；单纯编写提案不自动进入实现，已有实施授权继续有效。

rules:
  proposal:
    - 明确所属里程碑与外部审阅前的未提交状态；不把草案或静态核查写成运行通过。
  tasks:
    - 每项实现任务写明完成检查；编写提案不勾选实现任务。
    - 外部审阅、按 review 修订及提案提交列为流程说明，不混入产品实现进度；无 review.md 不立即提交，实施遵循用户实际授权。

conventions:
  language: 默认中文；仅 i18n/docs-manifest.json 登记的对外文档同轮维护英文
  naming:
    specs: openspec/specs/<capability>/spec.md
    changes: openspec/changes/<verb-led-kebab-name>/
    archive: openspec/changes/archive/<YYYY-MM-DD>-<change-name>/
  evidence:
    honesty: 未执行、未测、受阻如实单列；不把机器通过或 Agent 声称完成写成人工验收通过
  authority: 源码 > changes/archive/ > specs/ > docs/ > AGENTS.md
